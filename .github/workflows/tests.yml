name: Tests

# Runs on every push to master, which includes merged pull requests.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JwtAuthentication.slnx

      - name: Test
        run: dotnet test JwtAuthentication.slnx --no-restore --configuration Release
