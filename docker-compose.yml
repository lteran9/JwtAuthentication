services:
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/data/app.db"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    volumes:
      - api-data:/data

  ui:
    build:
      context: .
      dockerfile: UI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  api-data:
